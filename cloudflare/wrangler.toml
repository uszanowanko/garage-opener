# Deploy with: wrangler deploy   (run from this directory)
# See ../docs/extended-log.md for the full setup.

name = "garage-log"
main = "worker.js"
compatibility_date = "2024-01-01"

kv_namespaces = [
  { binding = "LOGS", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# LOG_WRITE_KEY is a secret, not set here:
#   wrangler secret put LOG_WRITE_KEY
