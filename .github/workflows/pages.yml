name: Deploy web/ to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# web/** already covers config.js, i18n.js and apply-config.mjs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Each key can be set as a repo Variable OR a repo Secret (Secret wins);
      # unset -> keep the committed web/config.js value. On a public repo, put
      # the topics in Secrets so they stay out of git and out of run logs.
      # Settings -> Secrets and variables -> Actions.
      - name: Apply config (Secrets/Variables override web/config.js)
        run: node web/apply-config.mjs
        env:
          DEVICE_NAME: ${{ secrets.DEVICE_NAME || vars.DEVICE_NAME }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME || vars.ADMIN_NAME }}
          WEB_LANG: ${{ secrets.WEB_LANG || vars.WEB_LANG }}
          NTFY_BASE: ${{ secrets.NTFY_BASE || vars.NTFY_BASE }}
          CMD_TOPIC: ${{ secrets.CMD_TOPIC || vars.CMD_TOPIC }}
          LOG_TOPIC: ${{ secrets.LOG_TOPIC || vars.LOG_TOPIC }}
          CF_LOG_URL: ${{ secrets.CF_LOG_URL || vars.CF_LOG_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
