<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gate</title>
<meta name="theme-color" content="#111417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gate">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --fg: #1a1c1e; --muted: #5f6368;
    --line: #e3e5e8; --accent: #1a73e8; --accent-fg: #ffffff;
    --ok: #1e8e3e; --err: #d93025; --warn: #b06000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111417; --card: #1c2024; --fg: #e8eaed; --muted: #9aa0a6;
      --line: #2e3236; --accent: #8ab4f8; --accent-fg: #06121f;
      --ok: #81c995; --err: #f28b82; --warn: #fdd663;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 20px; }
  h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .01em; margin: 0; }
  select#lang {
    font: inherit; font-size: .85rem; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
  }
  button {
    font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); padding: 12px 16px;
  }
  button:active { transform: translateY(1px); }
  #open {
    width: 100%; padding: 28px 16px; font-size: 1.35rem; font-weight: 600;
    background: var(--accent); color: var(--accent-fg); border: none; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  #open[disabled] { opacity: .55; cursor: default; }
  #open svg { width: 26px; height: 26px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); font-size: .85rem; }
  #status { min-height: 1.4em; margin: 12px 2px 0; font-size: .9rem; text-align: center; }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  ul#log { list-style: none; margin: 0; padding: 0; }
  ul#log li { padding: 10px 0; border-top: 1px solid var(--line); font-size: .92rem; }
  ul#log li:first-child { border-top: none; }
  ul#log time { display: block; color: var(--muted); font-size: .78rem; margin-top: 2px; }
  ul#log .entry { display: flex; align-items: center; gap: 8px; }
  ul#log .entry .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul#log .ic { width: 18px; height: 18px; flex: none; }
  ul#log .ic-open { color: var(--ok); }
  ul#log .ic-closed { color: var(--accent); }
  ul#log .ic-burst { color: var(--warn); }
  ul#log .ic-unknown { color: var(--muted); }
  footer { margin-top: auto; padding-top: 18px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="title">Gate</h1>
    <select id="lang" aria-label="Language"></select>
  </div>

  <!-- no credentials, no invite link in the URL -->
  <section id="invite" class="card" hidden>
    <p style="margin-top:0" data-i18n="invite.title"></p>
    <p class="muted" id="inviteBody"></p>
    <p class="muted" style="margin-bottom:0"><a href="#" id="manualLink" data-i18n="invite.manual"></a></p>
  </section>

  <!-- manual fallback -->
  <section id="setup" class="card" hidden>
    <p class="muted" style="margin-top:0" data-i18n="setup.intro"></p>
    <label for="name" data-i18n="setup.name"></label>
    <input id="name" autocomplete="off" autocapitalize="words" spellcheck="false">
    <label for="key" data-i18n="setup.key"></label>
    <input id="key" type="password" autocomplete="off" spellcheck="false">
    <button id="save" style="margin-top:16px; width:100%" data-i18n="setup.save"></button>
    <p id="setupErr" class="muted" style="color:var(--err)"></p>
  </section>

  <!-- main -->
  <section id="app" hidden>
    <button id="open">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10 12 4l9 6v10H3z"/><path d="M7 20v-7h10v7"/>
      </svg>
      <span id="openLabel"></span>
    </button>
    <div id="status"></div>

    <div class="card" style="margin-top:16px">
      <div class="row">
        <strong data-i18n="app.recent"></strong>
        <button id="refresh" class="muted" style="padding:4px 10px; font-size:.8rem" data-i18n="app.refresh"></button>
      </div>
      <ul id="log"></ul>
      <p class="muted" id="histNote" style="margin-bottom:0"></p>
    </div>

    <footer class="muted">
      <span id="signedIn"></span> &middot; <a href="#" id="forget" data-i18n="app.reset"></a>
    </footer>
  </section>
</main>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
const cfg = window.GARAGE_CONFIG || {};
const I18N = window.GARAGE_I18N || { en: {} };
const LANGS = Object.keys(I18N);

const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const toHex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
const HEX64 = /^[0-9a-f]{64}$/;
const validName = (n) => !!n && n.length <= 31 && !/[;:]/.test(n) && !/[\x00-\x1f\x7f]/.test(n);

const safeLS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

// ---- language -------------------------------------------------------------
function resolveLang() {
  const stored = safeLS.get("garage_lang");
  if (stored && LANGS.includes(stored)) return stored;
  const pinned = (cfg.lang || "auto").toLowerCase();
  if (pinned !== "auto" && LANGS.includes(pinned)) return pinned;
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const base = String(l).toLowerCase().split("-")[0];
    if (LANGS.includes(base)) return base;
  }
  return LANGS.includes("en") ? "en" : LANGS[0];
}
let LANG = resolveLang();

function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? (I18N.en && I18N.en[key]) ?? key;
  if (vars) for (const k in vars) s = s.replaceAll("{" + k + "}", vars[k]);
  return s;
}

// ---- manifest / title (installed-app name) --------------------------------
function applyChrome() {
  const name = cfg.deviceName || "Gate";
  document.documentElement.lang = LANG;
  document.title = name;
  $("title").textContent = name;
  const apple = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (apple) apple.content = name;
  try {
    const m = {
      name, short_name: name, start_url: "./", scope: "./", display: "standalone",
      background_color: "#111417", theme_color: "#111417",
      icons: [{ src: "icon.svg", sizes: "any", type: "image/svg+xml", purpose: "any" }],
    };
    const link = document.querySelector('link[rel="manifest"]');
    if (link) link.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
  } catch {}
}

function applyI18n() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  $("openLabel").textContent = t("app.open");
  $("inviteBody").textContent = t("invite.body", { admin: cfg.adminName || t("invite.adminFallback") });
  if (store.name) $("signedIn").textContent = t("app.signedInAs", { name: store.name });
}

// language switcher
LANGS.forEach((code) => {
  const o = document.createElement("option");
  o.value = code;
  o.textContent = (I18N[code] && I18N[code]["lang.name"]) || code;
  $("lang").appendChild(o);
});
$("lang").value = LANG;
$("lang").onchange = () => { safeLS.set("garage_lang", $("lang").value); LANG = $("lang").value; applyChrome(); applyI18n(); render(); };

// ---- credentials ---------------------------------------------------------
const store = {
  get name() { return safeLS.get("garage_name"); },
  get k() { return safeLS.get("garage_k"); },
  set(name, k) { safeLS.set("garage_name", name); safeLS.set("garage_k", k); },
  clear() { safeLS.del("garage_name"); safeLS.del("garage_k"); },
};

// personal setup link: .../#n=<name>&k=<64hex>  (query string also tolerated)
function provisionFromUrl() {
  for (const raw of [location.hash.slice(1), location.search.slice(1)]) {
    if (!raw) continue;
    const p = new URLSearchParams(raw);
    const n = (p.get("n") || "").trim();
    const k = (p.get("k") || "").trim().toLowerCase();
    if (validName(n) && HEX64.test(k)) {
      store.set(n, k);
      history.replaceState(null, "", location.pathname);
      return true;
    }
  }
  return false;
}

function render() {
  if (!(store.name && store.k)) provisionFromUrl();
  const ready = !!(store.name && store.k);
  $("app").hidden = !ready;
  $("invite").hidden = ready;
  $("setup").hidden = true;
  if (ready) {
    $("signedIn").textContent = t("app.signedInAs", { name: store.name });
    loadLog();
  }
}

// HMAC key is the ASCII bytes of the hex string k - see docs/protocol.md
async function hmacHex(kHex, msg) {
  const key = await crypto.subtle.importKey(
    "raw", enc.encode(kHex), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return toHex(await crypto.subtle.sign("HMAC", key, enc.encode(msg)));
}

$("manualLink").onclick = (e) => { e.preventDefault(); $("invite").hidden = true; $("setup").hidden = false; };

$("save").onclick = () => {
  const name = $("name").value.trim();
  const key = $("key").value.trim().toLowerCase();
  $("setupErr").textContent = "";
  if (!validName(name)) { $("setupErr").textContent = t("setup.errName"); return; }
  if (!HEX64.test(key)) { $("setupErr").textContent = t("setup.errKey"); return; }
  store.set(name, key);
  $("key").value = "";
  render();
};

$("forget").onclick = (e) => {
  e.preventDefault();
  if (confirm(t("app.resetConfirm"))) { store.clear(); render(); }
};

let busy = false;
$("open").onclick = async () => {
  if (busy) return;
  busy = true;
  $("open").disabled = true;
  setStatus(t("app.sending"), "");
  try {
    const ts = Math.floor(Date.now() / 1000);
    const name = store.name;
    const sig = await hmacHex(store.k, `v1:${ts}:${name}`);
    const res = await fetch(`${cfg.ntfy}/${cfg.cmdTopic}`, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: `v1;${ts};${name};${sig}`,
    });
    if (!res.ok) throw new Error(`ntfy ${res.status}`);
    setStatus(t("app.sent"), "ok");
    setTimeout(loadLog, 2500);
  } catch (err) {
    setStatus(t("app.failed", { msg: err.message }), "err");
  } finally {
    setTimeout(() => { busy = false; $("open").disabled = false; }, 3000);
  }
};

function setStatus(msg, cls) {
  const el = $("status");
  el.textContent = msg;
  el.className = cls || "";
}

$("refresh").onclick = loadLog;

// A deliberate open->close cycle takes ~20-25s (see docs). Two actuations
// closer together than this are the same person re-clicking, not a real
// second action - flag the later one(s) as a "burst" instead of open/closed.
const BURST_GAP_S = 15;

// Mutates rows in place: sets `.burst = true` on any row within BURST_GAP_S
// of the previous one (chronologically), regardless of display order.
function annotateBursts(rows) {
  const asc = [...rows].sort((a, b) => a.time - b.time);
  for (let i = 1; i < asc.length; i++) {
    if (asc[i].time - asc[i - 1].time < BURST_GAP_S) asc[i].burst = true;
  }
  return rows;
}

const ICONS = {
  open: '<svg class="ic ic-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>',
  closed: '<svg class="ic ic-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>',
  burst: '<svg class="ic ic-burst" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>',
  unknown: '<svg class="ic ic-unknown" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/></svg>',
};

function iconKeyFor(row) {
  if (row.burst) return "burst";
  if (row.state === "open" || row.state === "closed") return row.state;
  return "unknown";
}

function iconTitleFor(key) {
  return t("app.icon." + key);
}

// rows: {name, time, state?, burst?, message?} - `message` (a plain sentence)
// is the fallback for older ntfy entries logged before structured tags/state
// existed.
function renderRows(rows) {
  const ul = $("log");
  if (!rows.length) { ul.innerHTML = `<li class="muted">${t("app.noRecent")}</li>`; return; }
  annotateBursts(rows);
  ul.innerHTML = rows.map((m) => {
    const key = iconKeyFor(m);
    const who = m.name ? escapeHtml(m.name) : escapeHtml(m.message || "?");
    return `<li><span class="entry" title="${escapeHtml(iconTitleFor(key))}">${ICONS[key]}` +
           `<span class="who">${who}</span></span><time>${rel(m.time)}</time></li>`;
  }).join("");
}

// History: try the Cloudflare Worker first (no 12h cap) if configured. Only
// fall back to ntfy's 12h cache when the Worker doesn't answer at all - see
// docs/extended-log.md.
async function loadLog() {
  const ul = $("log");
  ul.innerHTML = `<li class="muted">${t("app.loading")}</li>`;
  $("histNote").textContent = cfg.cfLog ? "" : t("app.retention");

  if (cfg.cfLog) {
    try {
      const res = await fetch(`${cfg.cfLog}?limit=10`);
      if (res.ok) {
        renderRows(await res.json());
        return;
      }
    } catch {}
    $("histNote").textContent = t("app.histFallback12h");
  }

  try {
    const res = await fetch(`${cfg.ntfy}/${cfg.logTopic}/json?poll=1&since=12h`);
    const text = await res.text();
    const rows = text.trim().split("\n").filter(Boolean)
      .map((l) => { try { return JSON.parse(l); } catch { return null; } })
      .filter((m) => m && m.event === "message")
      .sort((a, b) => b.time - a.time)
      .slice(0, 10)
      // ntfy's own JSON: `tags: [name, state]` set by the firmware, or
      // absent on entries logged before this feature - fall back to the
      // plain sentence for those.
      .map((m) => ({ name: m.tags && m.tags[0], state: m.tags && m.tags[1], time: m.time, message: m.message }));
    renderRows(rows);
  } catch {
    ul.innerHTML = `<li class="muted">${t("app.histError")}</li>`;
  }
}

function rel(epoch) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - epoch));
  if (s < 60) return t("time.justNow");
  if (s < 3600) return t("time.minAgo", { n: Math.floor(s / 60) });
  if (s < 86400) return t("time.hAgo", { n: Math.floor(s / 3600) });
  return new Date(epoch * 1000).toLocaleString();
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

applyChrome();
applyI18n();
render();
</script>
</body>
</html>
