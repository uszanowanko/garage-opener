; Pinned on purpose. platform-espressif32 6.9.0 == arduino-esp32 2.0.17.
; Do not bump without re-checking: esp_task_wdt_init() signature, WiFiClientSecure,
; and the mbedtls/md.h HMAC API all changed in the 3.x core.

[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 921600
board_build.partitions = min_spiffs.csv   ; 1.9 MB app x2 -> comfortable OTA headroom
build_flags =
    -D CORE_DEBUG_LEVEL=2
lib_deps =
    ; none. SHA/HMAC (mbedTLS), WebServer, ArduinoOTA, WiFiClientSecure are all in-core.

; OTA: `pio run -d firmware -t upload --upload-port garage.local`
; (prompts for OTA_PASSWORD from config.h via upload_flags if you set it here)
